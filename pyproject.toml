[project]
name = "mcp-audit"
version = "0.1.0"
description = "Open-source security scanner for MCP (Model Context Protocol) servers."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Marcos Lozina", email = "marcoslozina@gmail.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "security",
    "security-scanner",
    "llm",
    "ai-security",
    "prompt-injection",
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.5.0",
    "mcp>=2.1.1",
    "rich>=13.7.0",
]

[project.scripts]
mcp-audit = "mcp_audit:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Default rule set (E/F) plus a few high-signal categories. Deliberately not
# exhaustive per the project's current maturity — see AGENTS.md for the
# "don't gold-plate" testing philosophy applied here too.
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501", # line length is enforced by the formatter/line-length setting, not worth hard-failing CI on
]

[tool.mypy]
# Same "don't gold-plate" philosophy as the ruff config above: this catches
# real type errors (wrong argument types, unannotated defs, mismatched
# return types) without going all the way to --strict, which would demand
# things like disallow_any_generics or warn_unused_ignores that aren't
# worth the friction for a project this size.
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true

# The `mcp` SDK doesn't ship a py.typed marker / inline type info, so mypy
# can't check against its real types — without this, every import of
# `mcp.*` fails with "missing library stubs" noise unrelated to mcp-audit's
# own code.
[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true
