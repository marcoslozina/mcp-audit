# TEMPORARY workflow to validate action.yml (the reusable composite Action)
# works as a real GitHub Action before it's advertised in the README /
# Marketplace. Invokes the action from this same repo via `uses: ./` against
# both example servers:
#   - clean-server: examples/toy_server.py, expected to pass (exit 0).
#   - evil-server:  examples/evil_server.py, expected to be caught (exit 1) —
#     the job asserts that the action step actually failed and that its
#     outputs reflect a critical finding, rather than just letting the job
#     go red and calling that good enough.
#
# This file is deleted once both jobs are confirmed green in a real run —
# it exists to prove action.yml works, not as permanent project CI.

name: test-action (temporary)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This is setup for the TARGET server being scanned, not for
      # mcp-audit itself (the action installs mcp-audit in its own
      # isolated uv tool environment). examples/toy_server.py imports the
      # `mcp` SDK, so plain `python` on PATH needs it installed — exactly
      # what a real consumer repo would already have done for their own
      # server before this action runs.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install target server dependencies
        run: pip install "mcp>=2.1.1"

      - name: Run mcp-audit action against toy_server.py (expected clean)
        id: audit
        uses: ./
        with:
          server-command: 'python examples/toy_server.py'
          mcp-audit-ref: ${{ github.sha }}

      - name: Assert clean pass
        shell: bash
        run: |
          echo "exit-code=${{ steps.audit.outputs.exit-code }}"
          echo "summary=${{ steps.audit.outputs.summary }}"
          echo "report-path=${{ steps.audit.outputs.report-path }}"
          if [ "${{ steps.audit.outputs.exit-code }}" != "0" ]; then
            echo "::error::expected exit-code 0 against toy_server.py, got ${{ steps.audit.outputs.exit-code }}"
            exit 1
          fi

  evil-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same reason as clean-server's equivalent step: evil_server.py also
      # imports the `mcp` SDK to run as a server at all.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install target server dependencies
        run: pip install "mcp>=2.1.1"

      - name: Run mcp-audit action against evil_server.py (expected to fail)
        id: audit
        continue-on-error: true
        uses: ./
        with:
          server-command: 'python examples/evil_server.py'
          mcp-audit-ref: ${{ github.sha }}

      - name: Assert the action step actually failed
        shell: bash
        run: |
          echo "outcome=${{ steps.audit.outcome }}"
          echo "exit-code=${{ steps.audit.outputs.exit-code }}"
          echo "summary=${{ steps.audit.outputs.summary }}"
          if [ "${{ steps.audit.outcome }}" != "failure" ]; then
            echo "::error::expected the action step to fail against evil_server.py, but outcome was '${{ steps.audit.outcome }}'"
            exit 1
          fi
          if [ "${{ steps.audit.outputs.exit-code }}" != "1" ]; then
            echo "::error::expected exit-code 1 against evil_server.py, got '${{ steps.audit.outputs.exit-code }}'"
            exit 1
          fi
          echo "confirmed: action step correctly failed on evil_server.py"
