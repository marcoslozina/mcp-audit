# Minimal CI for mcp-audit itself (not the consumer example — see
# examples/github-actions/mcp-audit-ci.yml for that).
#
# This is a smoke test, not a full test suite: it just confirms the CLI
# still runs end-to-end against the example servers shipped in this repo
# after every change.
#   - toy_server.py is expected to pass cleanly (exit 0).
#   - evil_server.py is deliberately malicious (Unicode-concealment payload)
#     and is expected to be CAUGHT, i.e. mcp-audit must exit 1 against it.
#     A passing scan against evil_server.py would mean the detector broke.
#   - toy_http_server.py is the same clean server as toy_server.py, but
#     served over plaintext HTTP with no auth — expected to be CAUGHT
#     (transport-security + unauthenticated-discovery), proving the remote
#     transport actually connects and those checks actually run in CI, not
#     just locally.

name: smoke test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Scan toy_server.py (expected clean)
        run: uv run mcp-audit scan -- python examples/toy_server.py

      - name: Scan evil_server.py (expected to be caught)
        run: |
          if uv run mcp-audit scan -- python examples/evil_server.py; then
            echo "::error::evil_server.py was NOT flagged — unicode-concealment detector may be broken"
            exit 1
          else
            echo "evil_server.py correctly flagged (non-zero exit) — detector working"
          fi

      - name: Scan toy_http_server.py over HTTP (expected to be caught)
        run: |
          uv run python examples/toy_http_server.py 8765 &
          SERVER_PID=$!
          for i in $(seq 1 50); do
            if (echo > /dev/tcp/127.0.0.1/8765) 2>/dev/null; then break; fi
            sleep 0.2
          done
          set +e
          uv run mcp-audit scan -- http://127.0.0.1:8765/mcp
          SCAN_EXIT=$?
          kill "$SERVER_PID" 2>/dev/null
          set -e
          if [ "$SCAN_EXIT" -eq 0 ]; then
            echo "::error::toy_http_server.py (plaintext, no auth) was NOT flagged — transport-security/unauthenticated-discovery may be broken"
            exit 1
          else
            echo "toy_http_server.py correctly flagged (non-zero exit) — HTTP transport checks working"
          fi
