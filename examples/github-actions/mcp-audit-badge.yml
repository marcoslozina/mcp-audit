# mcp-audit security badge — publish a shields.io badge from your own CI
# ---------------------------------------------------------------------------
# Example for people building their OWN MCP server who want a "scanned with
# mcp-audit" badge in their README. This is not mcp-audit's own CI — copy
# this file into YOUR server's repo (e.g. .github/workflows/mcp-audit-badge.yml)
# and edit the one step marked "replace" below.
#
# What this workflow does:
#   1. Checks out your repo.
#   2. Installs mcp-audit (from GitHub — it's not on PyPI yet).
#   3. Runs `mcp-audit badge` against YOUR server's start command. Unlike
#      `mcp-audit scan`, `badge` doesn't print a full report — it prints one
#      line of JSON in the shields.io "endpoint badge" format:
#      https://shields.io/badges/endpoint-badge
#      i.e. {"schemaVersion": 1, "label": "mcp-audit", "message": "...", "color": "..."}
#   4. Publishes that JSON to a GitHub Gist YOU own, so shields.io has a
#      stable URL to fetch it from. mcp-audit does not host anything for
#      you — there is no mcp-audit server in this loop at all, which is the
#      point: the badge is entirely self-hosted on your own GitHub account.
#
# TRUST MODEL — please read this before using the badge:
#   This badge is self-reported, exactly like any "build passing" badge
#   generated by your own CI. Nobody but you runs this scan, nobody but you
#   controls the Gist it publishes to, and there is currently no central,
#   third-party verification that the scan you ran matches the badge you're
#   displaying. That's an explicit, honest limitation, not an oversight — a
#   hosted, independently-verified version of this (mcp-audit scanning your
#   server itself, on its own schedule, from its own infrastructure) is on
#   the long-term roadmap as a separate paid service, but does not exist
#   today. Anyone relying on this badge for more than "the maintainer says
#   they check this" should ask for the actual `mcp-audit scan --format
#   json` output, not just the badge color.
#
# ---------------------------------------------------------------------------
# ONE-TIME MANUAL SETUP (do this before the workflow below will work):
#
#   1. Create a new GitHub Gist (https://gist.github.com/) — it can be
#      public or secret, but it MUST be public if you want shields.io (an
#      external service) to be able to fetch it without auth. Add one file
#      to it named exactly `mcp-audit-badge.json` with placeholder content
#      like `{}` — the workflow below overwrites it on every run, but the
#      Gist and that filename need to already exist. Note the Gist's ID
#      from its URL: https://gist.github.com/<your-username>/<GIST-ID>
#
#   2. Generate a GitHub Personal Access Token with ONLY the `gist` scope
#      (Settings -> Developer settings -> Personal access tokens). This
#      token can create/update your gists — nothing else — so scope it
#      narrowly and don't reuse a broader token here.
#
#   3. In the repo that will run this workflow, add:
#        - A repository SECRET named `GIST_SECRET` containing that token
#          (Settings -> Secrets and variables -> Actions -> Secrets).
#        - A repository VARIABLE named `GIST_ID` containing the Gist ID
#          from step 1 (same page, "Variables" tab). Variables aren't
#          secret — a Gist ID isn't sensitive on its own — but keeping it
#          out of the workflow file makes it easy to change later without
#          editing YAML.
#
#   Once both exist, the workflow below can update that Gist's
#   mcp-audit-badge.json on every run.
# ---------------------------------------------------------------------------

name: mcp-audit security badge

on:
  push:
    branches:
      - main
  # Optional: also refresh the badge on a schedule even if nothing changed,
  # so it doesn't silently go stale if this repo has quiet weeks.
  # schedule:
  #   - cron: "0 6 * * 1" # every Monday at 06:00 UTC

permissions:
  contents: read

jobs:
  mcp-audit-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Same rug-pull baseline caching rationale as mcp-audit-ci.yml: GitHub
      # Actions runners are ephemeral, so without this the rug-pull check
      # never has a prior baseline to compare against.
      - name: Cache mcp-audit rug-pull baselines
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.mcp-audit/baselines
          key: mcp-audit-baselines-${{ runner.os }}

      # mcp-audit is not published to PyPI yet — install straight from its
      # GitHub repo. Once/if it ships to PyPI, replace with: pip install mcp-audit
      - name: Install mcp-audit
        run: pip install git+https://github.com/marcoslozina/mcp-audit.git

      # -----------------------------------------------------------------
      # << replace with your server's start command >>
      #
      # Everything after `--` is passed literally to YOUR server's argv —
      # mcp-audit's own options (--source-dir, --server-id,
      # --update-baseline) must all go BEFORE `--`, never after. See
      # "Flag order matters" in the mcp-audit README:
      # https://github.com/marcoslozina/mcp-audit#-flag-order-matters
      #
      # Examples of what the placeholder below could become:
      #   python my_server.py
      #   node dist/server.js
      #   npx -y my-mcp-server-package
      #
      # `mcp-audit badge` exits 1 on any critical/high finding, same as
      # `scan` — this step is allowed to "fail" here (continue-on-error)
      # because we still want to publish a red badge reflecting that, not
      # abort the workflow before the Gist gets updated.
      # -----------------------------------------------------------------
      - name: Run mcp-audit badge
        continue-on-error: true
        run: |
          mcp-audit badge \
            --server-id my-mcp-server \
            -- << replace with your server's start command >> \
            > mcp-audit-badge.json

      - name: Show badge JSON (for the run log)
        run: cat mcp-audit-badge.json

      # Publishes the badge JSON to the Gist file created during one-time
      # setup, using the PAT stored as GIST_SECRET. actions/github-script
      # gives us the Octokit client + a JS runtime without adding a new
      # dependency to your project just to make one API call.
      - name: Publish badge JSON to Gist
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.GIST_SECRET }}
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('mcp-audit-badge.json', 'utf8');
            await github.rest.gists.update({
              gist_id: '${{ vars.GIST_ID }}',
              files: {
                'mcp-audit-badge.json': { content },
              },
            });

# ---------------------------------------------------------------------------
# Paste this in YOUR README once the above is working (replace
# <YOUR-GITHUB-USERNAME> and <GIST-ID> with your own):
#
#   [![mcp-audit](https://img.shields.io/endpoint?url=https://gist.githubusercontent.com/<YOUR-GITHUB-USERNAME>/<GIST-ID>/raw/mcp-audit-badge.json)](https://github.com/marcoslozina/mcp-audit)
#
# shields.io re-fetches that URL on every badge view (subject to its own
# caching), so the badge updates automatically as this workflow re-publishes
# the Gist — no need to touch the README again after the first paste.
# ---------------------------------------------------------------------------
